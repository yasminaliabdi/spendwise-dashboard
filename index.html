<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">💰</span>
                <span class="logo-text">SpendWise</span>
            </div>
            <nav class="nav">
                <a href="#" class="nav-item active">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">💸</span>
                    <span>Expenses</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">📈</span>
                    <span>Reports</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">🎯</span>
                    <span>Goals</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <h1>Dashboard</h1>
                <p>Welcome back, Yasmin</p>
            </div>
            <div class="header-actions">
                <button class="btn-icon">🔔</button>
                <div class="avatar">YA</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">

            <!-- Summary Cards -->
            <section class="summary">
                <div class="summary-card">
                    <p class="summary-label">Total Balance</p>
                    <p class="summary-value" id="total-balance">KSh 0</p>
                </div>
                <div class="summary-card">
                    <p class="summary-label">Income</p>
                    <p class="summary-value positive" id="total-income">+ KSh 0</p>
                </div>
                <div class="summary-card">
                    <p class="summary-label">Expenses</p>
                    <p class="summary-value negative" id="total-expenses">- KSh 0</p>
                </div>
            </section>

            <!-- Add Expense Form -->
            <section class="add-expense">
                <h2>Add Expense</h2>
                <div class="form-group">
                    <label for="expense-name">Expense Name:</label>
                    <input type="text" id="expense-name" placeholder="e.g., Lunch">
                </div>
                <div class="form-group">
                    <label for="expense-amount">Amount (KSh):</label>
                    <input type="number" id="expense-amount" placeholder="e.g., 500">
                </div>
                <div class="form-group">
                    <label for="expense-category">Category:</label>
                    <select id="expense-category">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Rent">Rent</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Savings">Savings</option>
                        <option value="Utilities">Utilities</option>
                    </select>
                </div>
                <button id="add-expense-btn">Add Expense</button>
            </section>

            <!-- Feedback Message -->
            <section class="feedback-section">
                <p id="feedback">✅ Good job! You are within budget.</p>
            </section>

            <!-- Expense List -->
            <section class="expense-list-section">
                <h2>Your Expenses</h2>
                <ul id="expense-list">
                    <li>No expenses yet.</li>
                </ul>
            </section>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
